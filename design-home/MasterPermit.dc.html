<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:#F6F6F8; --surface:#FFFFFF; --text:#141518; --textSecondary:#8A8A93; --textTertiary:#B4B4BD;
      --accent:#FEB70F; --onAccent:#141518; --success:#2FA36B; --warning:#F08C1E; --error:#E0483D;
      --info:#3D6BF5; --fresh:#7A5AF8; --border:#ECECF0; --divider:#F2F2F5;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;line-height:1.4}
    a{color:var(--accent)} a:hover{color:#E0A00A}
    .h1{font-size:24px;font-weight:600} .h2{font-size:20px;font-weight:600}
    .body{font-size:16px} .dense{font-size:14px} .cap{font-size:13px;color:var(--textSecondary)}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px}
    .chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 8px;font-size:13px}
    .side{width:240px;background:var(--surface);border-right:1px solid var(--border)}
    .navitem{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:14px;color:var(--textSecondary)}
    .navitem--active{background:rgba(254,183,15,.10);color:var(--text);font-weight:600}
    table{border-collapse:collapse;width:100%}
    th{font-size:13px;font-weight:600;color:var(--textSecondary);text-align:left;padding:8px 12px;border-bottom:1px solid var(--border)}
    td{font-size:14px;padding:10px 12px}
    tbody tr:nth-child(even){background:var(--bg)}

<div style="min-height:844px;display:flex;flex-direction:column">
  <!-- app bar -->
  <div style="padding:16px;display:flex;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--border)">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141518" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    <div class="h2" style="font-size:18px">Наряд-допуск</div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:4px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2FA36B" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      <span class="cap" style="color:var(--success)">Синхронизировано</span>
    </div>
  </div>

  <div style="padding:16px;display:flex;flex-direction:column;gap:16px;flex-grow:1">
    <!-- карточка наряда -->
    <div class="card" style="padding:16px;border-left:3px solid var(--success)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">
        <span class="chip" style="background:rgba(47,163,107,.12);color:var(--success);font-weight:600">Согласован</span>
        <span class="chip" style="background:var(--border);color:var(--textSecondary)">Стояк ХВС</span>
      </div>
      <div class="body" style="font-weight:600">Подъезд 1, подвал</div>
      <div class="cap" style="margin-top:4px">Сегодня, 14:00 — 16:00 · осталось 1 ч 24 мин</div>

      <div style="height:1px;background:var(--divider);margin:16px 0"></div>

      <div style="display:flex;align-items:flex-start;gap:12px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F08C1E" stroke-width="2" style="flex-shrink:0"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
        <div>
          <div class="dense" style="font-weight:600">Требуется отключение холодной воды</div>
          <div class="cap" style="margin-top:2px">Затронет 3 помещения</div>
        </div>
      </div>
    </div>

    <!-- кто встречает -->
    <div class="card" style="padding:16px;display:flex;align-items:center;gap:12px">
      <div style="width:44px;height:44px;border-radius:999px;background:var(--border);flex-shrink:0"></div>
      <div style="flex-grow:1">
        <div class="dense" style="font-weight:600">Встречает: Пётр Иванов</div>
        <div class="cap">Консьерж · подъезд 1</div>
      </div>
      <div style="width:40px;height:40px;border-radius:999px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141518" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 1.9.6 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.1a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.8.6a2 2 0 0 1 1.7 2z"/></svg>
      </div>
    </div>

    <!-- пропуск -->
    <div class="card" style="padding:16px;background:var(--bg);border:none;display:flex;align-items:center;gap:12px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8A8A93" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h4M7 13h10"/></svg>
      <div class="dense" style="flex-grow:1">Пропуск в здание выпущен</div>
      <span class="cap" style="font-weight:600;color:var(--text)">Показать</span>
    </div>

    <!-- фото до вскрытия -->
    <div>
      <div class="cap" style="font-weight:600;color:var(--text);margin-bottom:8px">Фото до вскрытия · обязательно</div>
      <div style="display:flex;gap:8px">
        <div style="width:96px;height:96px;border-radius:12px;border:1px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A8A93" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          <span class="cap">Снять</span>
        </div>
      </div>
    </div>
  </div>

  <!-- действие -->
  <div style="padding:16px;background:var(--surface);border-top:1px solid var(--border)">
    <button style="width:100%;height:52px;border-radius:8px;border:none;background:var(--border);color:var(--textSecondary);font-size:16px;font-weight:600">Открыл зону</button>
    <div class="cap" style="text-align:center;margin-top:8px">Сначала снимите фото зоны до вскрытия</div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic { renderVals(){ return {}; } }
</script>
</body>
</html>
