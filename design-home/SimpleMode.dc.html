<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:#F6F6F8; --surface:#FFFFFF; --text:#141518; --textSecondary:#8A8A93; --textTertiary:#B4B4BD;
      --accent:#FEB70F; --onAccent:#141518; --success:#2FA36B; --warning:#F08C1E; --error:#E0483D;
      --info:#3D6BF5; --fresh:#7A5AF8; --border:#ECECF0; --divider:#F2F2F5;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;line-height:1.4}
    a{color:var(--accent)} a:hover{color:#E0A00A}
    .h1{font-size:24px;font-weight:600} .h2{font-size:20px;font-weight:600}
    .body{font-size:16px} .dense{font-size:14px} .cap{font-size:13px;color:var(--textSecondary)}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px}
    .chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 8px;font-size:13px}
    .side{width:240px;background:var(--surface);border-right:1px solid var(--border)}
    .navitem{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:14px;color:var(--textSecondary)}
    .navitem--active{background:rgba(254,183,15,.10);color:var(--text);font-weight:600}
    table{border-collapse:collapse;width:100%}
    th{font-size:13px;font-weight:600;color:var(--textSecondary);text-align:left;padding:8px 12px;border-bottom:1px solid var(--border)}
    td{font-size:14px;padding:10px 12px}
    tbody tr:nth-child(even){background:var(--bg)}

<div style="min-height:844px;display:flex;flex-direction:column;padding:24px;gap:32px;background:var(--bg)">
  <div style="padding-top:16px">
    <div style="font-size:30px;font-weight:600;line-height:1.3">Здравствуйте,<br>Гулнора Абдуллаевна</div>
  </div>

  <div style="display:flex;flex-direction:column;gap:32px">
    <button style="min-height:104px;border-radius:12px;border:none;background:var(--accent);color:var(--onAccent);font-size:26px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:16px;padding:16px">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#141518" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 1.9.6 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.1a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.8.6a2 2 0 0 1 1.7 2z"/></svg>
      Вызвать мастера
    </button>

    <button style="min-height:104px;border-radius:12px;border:2px solid var(--error);background:var(--surface);color:var(--error);font-size:24px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:16px;padding:16px">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#E0483D" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
      Авария в доме
    </button>
  </div>

  <div style="display:flex;flex-direction:column;gap:16px">
    <div style="font-size:20px;font-weight:600">Мои заявки</div>
    <div class="card" style="padding:20px">
      <div style="font-size:20px">Мастер едет к вам</div>
      <div style="font-size:17px;color:var(--textSecondary);margin-top:8px">Ремонт смесителя</div>
      <div style="font-size:17px;color:var(--textSecondary);margin-top:4px">Сегодня до 16:00</div>
    </div>
    <div class="card" style="padding:20px">
      <div style="font-size:20px">Завершено</div>
      <div style="font-size:17px;color:var(--textSecondary);margin-top:8px">Замена лампы в коридоре</div>
      <div style="font-size:17px;color:var(--textSecondary);margin-top:4px">12 августа</div>
    </div>
  </div>

  <div style="margin-top:auto;padding-top:16px;text-align:center">
    <span style="font-size:17px;color:var(--textSecondary);text-decoration:underline">Обычный режим</span>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic { renderVals(){ return {}; } }
</script>
</body>
</html>
