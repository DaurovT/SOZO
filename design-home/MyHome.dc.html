<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root{
      --bg:#F6F6F8; --surface:#FFFFFF; --text:#141518; --textSecondary:#8A8A93; --textTertiary:#B4B4BD;
      --accent:#FEB70F; --onAccent:#141518; --success:#2FA36B; --warning:#F08C1E; --error:#E0483D;
      --info:#3D6BF5; --fresh:#7A5AF8; --border:#ECECF0; --divider:#F2F2F5;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;line-height:1.4}
    a{color:var(--accent)} a:hover{color:#E0A00A}
    .h1{font-size:24px;font-weight:600} .h2{font-size:20px;font-weight:600}
    .body{font-size:16px} .dense{font-size:14px} .cap{font-size:13px;color:var(--textSecondary)}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px}
    .chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 8px;font-size:13px}
    .side{width:240px;background:var(--surface);border-right:1px solid var(--border)}
    .navitem{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;font-size:14px;color:var(--textSecondary)}
    .navitem--active{background:rgba(254,183,15,.10);color:var(--text);font-weight:600}
    table{border-collapse:collapse;width:100%}
    th{font-size:13px;font-weight:600;color:var(--textSecondary);text-align:left;padding:8px 12px;border-bottom:1px solid var(--border)}
    td{font-size:14px;padding:10px 12px}
    tbody tr:nth-child(even){background:var(--bg)}

<div style="min-height:844px;display:flex;flex-direction:column">
  <div style="padding:16px 16px 8px">
    <div class="h1" style="font-size:22px">Мой дом</div>
    <div class="cap" style="margin-top:2px">ЖК Сокол · кв. 12</div>
  </div>

  <div style="padding:0 16px;display:flex;flex-direction:column;gap:16px;flex-grow:1">
    <!-- аварийная служба -->
    <div class="card" style="padding:16px;background:rgba(224,72,61,.06);border:1px solid rgba(224,72,61,.3);display:flex;align-items:center;gap:12px">
      <div style="width:44px;height:44px;border-radius:999px;background:var(--error);display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 1.9.6 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.1a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.8.6a2 2 0 0 1 1.7 2z"/></svg>
      </div>
      <div style="flex-grow:1">
        <div class="body" style="font-weight:600">Аварийная служба дома</div>
        <div class="cap">+998 71 123 45 67 · круглосуточно</div>
      </div>
    </div>

    <!-- отключение -->
    <div class="card" style="padding:16px;border-left:3px solid var(--warning)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span class="chip" style="background:rgba(240,140,30,.14);color:#8a5200;font-weight:600">Завтра</span>
      </div>
      <div class="body" style="font-weight:600">Отключение холодной воды</div>
      <div class="cap" style="margin-top:4px">20 августа, 09:00 — 15:00 · ваш стояк</div>
      <div class="cap" style="margin-top:4px">Причина: замена участка стояка</div>
    </div>

    <!-- быстрые действия -->
    <div style="display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:12px">
      <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:8px;min-height:96px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A8A93" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
        <div class="dense" style="font-weight:600">Проблема в доме</div>
        <div class="cap">Передадим в УК</div>
      </div>
      <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:8px;min-height:96px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A8A93" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
        <div class="dense" style="font-weight:600">Отключения</div>
        <div class="cap">Календарь работ</div>
      </div>
      <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:8px;min-height:96px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A8A93" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h4M7 13h10"/></svg>
        <div class="dense" style="font-weight:600">Пропуск гостю</div>
        <div class="cap">QR за 10 секунд</div>
      </div>
      <div class="card" style="padding:16px;display:flex;flex-direction:column;gap:8px;min-height:96px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8A8A93" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <div class="dense" style="font-weight:600">Контакты УК</div>
        <div class="cap">Диспетчер, инженер</div>
      </div>
    </div>

    <!-- объявление -->
    <div>
      <div class="cap" style="font-weight:600;color:var(--text);margin-bottom:8px">Объявления УК</div>
      <div class="card" style="padding:16px">
        <div class="dense">Плановая проверка вентиляции 22 августа с 10:00. Просим обеспечить доступ.</div>
        <div class="cap" style="margin-top:8px">18 августа</div>
      </div>
    </div>
  </div>

  <!-- таббар -->
  <div style="display:flex;border-top:1px solid var(--border);background:var(--surface);padding:8px 0">
    <div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--textSecondary)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
      <span style="font-size:11px">Главная</span>
    </div>
    <div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--accent)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
      <span style="font-size:11px;font-weight:600">Мой дом</span>
    </div>
    <div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--textSecondary)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>
      <span style="font-size:11px">Заявки</span>
    </div>
    <div style="flex-grow:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--textSecondary)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/></svg>
      <span style="font-size:11px">Профиль</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic { renderVals(){ return {}; } }
</script>
</body>
</html>
