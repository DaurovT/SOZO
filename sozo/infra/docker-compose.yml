# SOZO — локальная инфраструктура разработки (DEV-04: PostgreSQL, Redis, S3-совместимое хранилище).
# Прод — два сервера в ЦОД РУз, Docker Compose без Kubernetes (DEV-04 §2).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sozo
      POSTGRES_PASSWORD: sozo
      POSTGRES_DB: sozo
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sozo']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

volumes:
  pg_data:
  redis_data:
  minio_data:
