name: sozo_client
description: "SOZO / USTAPRO — приложение «Клиент» (DEV-08, план сборки DEV-12)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  flutter_svg: ^2.3.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.2
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

# Та же причина, что в приложении мастера: objective_c 9.5 не собирается
# на этом macOS-хосте и роняет flutter test.
dependency_overrides:
  path_provider_foundation: 2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Material-иконки в экранах запрещены (DEV-12 правило 3), но шрифт нужен
  # самому фреймворку — курсор, служебные глифы, системные диалоги
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/logo/
    - assets/photo/
